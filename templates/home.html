<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  {{head}}
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/catalog.js" defer></script>
  <script src="js/site-config.js" defer></script>
  <script src="js/consent.js" defer></script>
  <script src="js/tracking.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/shopify-buy.js" defer></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="announcement"><span>STAY WIDE</span><span>COMING SOON</span></div>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Stay Wide home">{{brand}}</a>
    <nav aria-label="Main navigation">
      <a href="#shop">Shop</a>
      <a href="info.html">Info</a>

    </nav>
  </header>
  <main id="main">
    <section class="opening section-pad" aria-labelledby="hero-title">
      <div><h1 id="hero-title">STAY WIDE<span>.</span></h1></div>
      <a class="button button-dark" href="#shop">View collection <span aria-hidden="true">↓</span></a>
    </section>
    <section hidden class="campaign-media section-pad" aria-label="Campaign media">
      <!-- Add one real editorial photograph or film here, then remove hidden. -->
    </section>
    <section class="shop section-pad" id="shop" aria-labelledby="shop-title">
      <div class="collection-heading"><h2 id="shop-title">Collection</h2></div>
      <!-- Product cards are generated from js/catalog.js by scripts/build.cjs. -->
      <div class="product-grid collection-grid">{{cards}}</div>
    </section>


  </main>
{{footer}}
<p class="commerce-notice section-pad" data-shopify-error role="status" hidden></p>
{{consent}}
</body>
</html>
